name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick iOS simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries
                | map(select(.key | test("iOS")))
                | sort_by(.key) | last
                | .value | map(select(.name | test("^iPhone"))) | last | .name')
          echo "Selected: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build & test iOS (unit tests only)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cairn.xcodeproj \
            -scheme Cairn \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -only-testing:CairnTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Build watchOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cairn.xcodeproj \
            -scheme 'Cairn Watch App' \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
