name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (check only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict --quiet

  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build & test iOS
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cairn.xcodeproj \
            -scheme Cairn \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Build watchOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cairn.xcodeproj \
            -scheme 'Cairn Watch App' \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
