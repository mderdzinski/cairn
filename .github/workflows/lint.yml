name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (check only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict --quiet
