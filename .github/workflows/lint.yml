name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # xcode-27: the only hosted image with Xcode 27.1+ (iOS 27.1 SDK), which
    # iPhone Duo support requires. Its iOS 27.1 runtime ships the iPhone Duo
    # simulator, so the device picker below lands on it.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftformat swiftlint

      - name: SwiftFormat (check only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict --quiet
